# 每个服务限 3 个 10MB 日志文件，防止长期运行撑爆磁盘
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    logging: *default-logging
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: personal_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # 只绑定回环地址，避免部署到服务器时数据库对公网暴露；
      # 如需局域网访问改成 "5432:5432" 或指定网卡 IP。
      - "127.0.0.1:5432:5432"
    volumes:
      - personal_ai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d personal_ai"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    logging: *default-logging
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      # /metrics 与 /docs 随 API 一起暴露，默认仅本机可访问。
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: local
      API_PREFIX: /api
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/personal_ai
      AUTH_SECRET_KEY: change-me-in-production-use-at-least-32-bytes
      DEFAULT_USER_ID: 00000000-0000-0000-0000-000000000001
      RUNTIME_SETTINGS_ADMIN_USER_ID: 00000000-0000-0000-0000-000000000001
      LLM_PROVIDER: local_extractive
      EMBEDDING_PROVIDER: local_hash
      EMBEDDING_MODEL: text-embedding-3-small
      EMBEDDING_DIMENSIONS: 1536
      STORAGE_BACKEND: local
      STORAGE_ROOT: /data/storage
      OCR_PROVIDER: disabled
      SPEECH_TO_TEXT_PROVIDER: disabled
      CORS_ORIGINS: '["http://127.0.0.1:5600","http://localhost:5600"]'
    volumes:
      - personal_ai_storage:/data/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://127.0.0.1:8000/api/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    logging: *default-logging
    build:
      context: ./mobile
    restart: unless-stopped
    # API_BASE_URL 通过运行时环境变量注入（写入容器内的 env.js），
    # 修改地址只需改这里并 `docker compose up -d web`，无需重建镜像。
    environment:
      API_BASE_URL: http://127.0.0.1:8000/api
    ports:
      # Web 是唯一需要被浏览器访问的入口；本机使用保持回环绑定，
      # 局域网/公网使用时改成 "5600:80" 并自行前置 TLS 反向代理。
      - "127.0.0.1:5600:80"
    depends_on:
      api:
        condition: service_healthy

  prometheus:
    # 镜像用 latest：Docker Hub 在部分网络不可达，首次拉取后建议改成具体 tag
    image: prom/prometheus:latest
    profiles: ["monitoring"]
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:latest
    profiles: ["monitoring"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: personal-ai
    volumes:
      - grafana_data:/var/lib/grafana
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3300:3000"
    depends_on:
      - prometheus

volumes:
  personal_ai_pgdata:
  personal_ai_storage:
  prometheus_data:
  grafana_data:
